name: Publish Docker Images

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: publish-docker-images
  cancel-in-progress: false

jobs:
  publish:
    name: Publish multi-architecture images

    runs-on: ubuntu-24.04

    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&status=success" \
            --jq '.total_count')

          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$RESULT" -eq 0 ]; then
            echo "A successful CI run on main is required."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/edgarmata/mymachines-3d-quote-backend:latest
            ghcr.io/edgarmata/mymachines-3d-quote-backend:${{ github.sha }}

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/edgarmata/mymachines-3d-quote-frontend:latest
            ghcr.io/edgarmata/mymachines-3d-quote-frontend:${{ github.sha }}
