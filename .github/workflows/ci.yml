name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.arch }})

    runs-on: ${{ matrix.runner }}

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04

          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify runner architecture
        run: |
          uname -m
          docker info --format '{{.Architecture}}'

      - name: Validate Docker Compose configuration
        run: |
          docker compose config --quiet
          # Syntax only: these public paths do not authorize production startup.
          QUOTE_IMAGE_TAG=ci-check \
          NGINX_TRUSTED_PROXIES_FILE="${PWD}/frontend/nginx-trusted-proxies.conf" \
          PRICING_CONFIG_HOST_PATH="${PWD}/config/pricing.demo.json" \
            docker compose -f docker-compose.prod.yml config --quiet

      - name: Build Docker images
        run: docker compose build

      - name: Run frontend error handling tests
        run: |
          docker run --rm \
            -v "${PWD}/frontend:/app:ro" \
            -w /app node:24-alpine npm test

      - name: Test native Nginx abuse protection and trusted proxy chain
        run: backend/tests/run_nginx_abuse_tests.sh

      - name: Test private configuration isolation, HTTP contracts and price rollback
        run: python3 backend/tests/run_commercial_checks.py

      - name: Generate backend SBOM
        uses: anchore/sbom-action@v0
        with:
          image: mymachines-3d-quote-backend:latest
          format: spdx-json
          artifact-name: backend-sbom-${{ matrix.arch }}.spdx.json

      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0
        with:
          image: mymachines-3d-quote-frontend:latest
          format: spdx-json
          artifact-name: frontend-sbom-${{ matrix.arch }}.spdx.json

      - name: Verify OrcaSlicer CLI
        run: |
          docker compose run --rm --no-deps backend \
            /opt/orca/AppRun --help

      - name: Run backend tests
        run: |
          docker compose run --rm --no-deps \
            -v "${PWD}/backend/tests:/app/tests:ro" \
            backend \
            python -m unittest discover \
            -s /app/tests -v

      - name: Start application
        run: docker compose up -d

      - name: Wait for backend
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Test backend printing options
        run: |
          curl --fail --silent --show-error \
            http://localhost:8000/options

      - name: Test frontend
        run: |
          curl --fail --silent --show-error \
            http://localhost:8080/ \
            -o /dev/null

      - name: Test frontend API proxy
        run: |
          curl --fail --silent --show-error \
            http://localhost:8080/api/options

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application
        if: always()
        run: docker compose down --volumes --remove-orphans
