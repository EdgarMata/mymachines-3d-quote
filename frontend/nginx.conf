server {
    listen 80;
    server_name _;

    # 50 MiB STL plus 1 MiB for multipart overhead. Keep aligned with the API.
    client_max_body_size 51m;
    proxy_request_buffering on;
    # Preserve automatic cleanup of request-body temporary files.
    client_body_in_file_only off;

    root /usr/share/nginx/html;
    index index.html;

location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $backend http://backend:8000;

    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;

    proxy_http_version 1.1;

    # Slicer deadline is 60s; allow cleanup plus geometry/response overhead.
    # This is an upstream inactivity timeout, not a total request deadline.
    proxy_read_timeout 90s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

    location / {
        try_files $uri $uri/ /index.html;
    }
}
