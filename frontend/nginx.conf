# NPM must send one bare literal address. Reject lists/duplicates/whitespace;
# invalid numeric literals fall back to the TCP peer in the real-IP module.
map $http_x_real_ip $ambiguous_client_ip {
    default 1;
    "" 0;
    ~^[0-9A-Fa-f:.]+$ 0;
}

# Exempt only bodyless GET/HEAD probes, never uploads disguised as health checks.
map "$request_method:$uri:$http_content_length:$http_transfer_encoding" $health_probe {
    default 0;
    ~^(GET|HEAD):/(api/)?health/?:0?:$ 1;
}
# Empty keys are not accounted. Match normalized paths before/after /api rewrite.
map $health_probe $api_client {
    default $binary_remote_addr;
    1 "";
}
map $health_probe $api_global {
    default api;
    1 "";
}
map $uri $analyze_client {
    default "";
    ~^/(api/)?analyze/?$ $binary_remote_addr;
}
map $uri $estimate_client {
    default "";
    ~^/(api/)?(estimate|upload|slice)/?$ $binary_remote_addr;
}
map $uri $options_client {
    default "";
    ~^/(api/)?options/?$ $binary_remote_addr;
}
map $uri $other_client {
    default $api_client;
    ~^/(api/)?(analyze|estimate|upload|slice|options)/?$ "";
}

limit_req_zone $analyze_client zone=analyze:1m rate=30r/m;
limit_req_zone $estimate_client zone=estimate:1m rate=10r/m;
limit_req_zone $options_client zone=options:1m rate=60r/m;
limit_req_zone $other_client zone=other_api:1m rate=60r/m;
limit_req_zone $api_global zone=global_api:1m rate=10r/s;
limit_conn_zone $api_client zone=api_connections:1m;
limit_conn_zone $api_global zone=global_connections:64k;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Only exact trusted peers may supply the canonical client address. The
    # immediate proxy must OVERWRITE X-Real-IP with its verified client address.
    include /etc/nginx/trusted-proxies.conf;
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    # A return-only rewrite guard does not enter multipart/body processing.
    if ($ambiguous_client_ip) {
        return 400 '{"detail":"Invalid client address header."}';
    }

    # 50 MiB STL plus 1 MiB for multipart overhead. Keep aligned with the API.
    client_max_body_size 51m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    proxy_request_buffering on;
    # Preserve automatic cleanup of request-body temporary files.
    client_body_in_file_only off;

    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @too_many_requests;

    root /usr/share/nginx/html;
    index index.html;

location /api/ {
    limit_req zone=analyze burst=5 nodelay;
    limit_req zone=estimate burst=2 nodelay;
    limit_req zone=options burst=10 nodelay;
    limit_req zone=other_api burst=5 nodelay;
    limit_req zone=global_api burst=20 nodelay;
    limit_conn api_connections 5;
    limit_conn global_connections 20;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $backend http://backend:8000;

    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;

    proxy_http_version 1.1;

    # Slicer deadline is 60s; allow cleanup plus geometry/response overhead.
    # This is an upstream inactivity timeout, not a total request deadline.
    proxy_read_timeout 90s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
}

    location @too_many_requests {
        default_type application/json;
        # Recovery of a connection limit depends on active clients, not a timer.
        return 429 '{"detail":"Too many requests. Please wait a moment and try again."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
