name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.arch }})

    runs-on: ${{ matrix.runner }}

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04

          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify runner architecture
        run: |
          uname -m
          docker info --format '{{.Architecture}}'

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build

      - name: Verify OrcaSlicer CLI
        run: |
          docker compose run --rm --no-deps backend \
            /opt/orca/AppRun --help

      - name: Run backend tests
        run: |
          docker compose run --rm --no-deps \
            -v "${PWD}/backend/tests:/app/tests:ro" \
            backend \
            python -m unittest discover \
            -s /app/tests -v

      - name: Start application
        run: docker compose up -d

      - name: Wait for backend
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Test backend printing options
        run: |
          curl --fail --silent --show-error \
            http://localhost:8000/options

      - name: Test frontend
        run: |
          curl --fail --silent --show-error \
            http://localhost:8080/ \
            -o /dev/null

      - name: Test frontend API proxy
        run: |
          curl --fail --silent --show-error \
            http://localhost:8080/api/options

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application
        if: always()
        run: docker compose down --volumes --remove-orphans
